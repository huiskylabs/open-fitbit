<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>日晷 睡眠</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="dialstyle.css"></head><body>
<div class="hd"><h1>睡眠 · 昨晚</h1><span class="r">11月3日晚</span></div>
<div class="seg"><span class="on">日</span><span>周</span><span>月</span><span>3个月</span></div>
<svg id="dial" viewBox="0 0 393 384" width="393" height="384" style="margin:4px -16px 0"></svg>
<div id="below"></div>
<script type="module">
import * as D from './data.js';
import { makeDial, corona, smooth } from './dialkit.js';
import { tabs } from './tabs.js';
const n = D.last, cx = 196.5, cy = 194;
// a 12-hour watch face: the night sits where your watch hands were
const K = makeDial({ cx, cy, mode: 'night' });
const R = { AWAKE: 126, REM: 112, LIGHT: 98, DEEP: 74 };
let g = `<circle cx="${cx}" cy="${cy}" r="150" fill="none" stroke="var(--line)"/>`;
g += K.ticks({ r: 150, n: 60, every: 5, label: false, long: .8 });
for (const [h, lab] of [[0, '12'], [3, '3'], [6, '6'], [9, '9']]) { const [x, y] = K.pt((h / 12) * Math.PI * 2, 164); g += `<text class="tn" x="${x}" y="${y + 5}" text-anchor="middle" style="font-size:17px">${lab}</text>`; }
// one ring per stage, like the rows of a hypnogram wrapped around the watch: each stage keeps its own color
const BAND = { AWAKE: [118, 126], REM: [104, 115], LIGHT: [90, 101], DEEP: [68, 87] };
const COL = { AWAKE: 'var(--awake-strong)', REM: 'var(--rem)', LIGHT: 'var(--light)', DEEP: 'var(--deep)' };
for (const k of Object.keys(BAND)) { const [r0, r1] = BAND[k]; g += `<path d="${K.arc(n.bed, n.wake, r0, r1)}" fill="color-mix(in srgb, var(--ink) 5%, transparent)"/>`; }
// thin steps between stages, like a hypnogram, so you can follow the night from one stage to the next
n.stages.forEach((st, i) => { const nx = n.stages[i + 1]; if (!nx) return; const a = BAND[st.type], b = BAND[nx.type]; const lo = Math.min(a[0], b[0]), hi = Math.max(a[1], b[1]); const [x0, y0] = K.pt(K.ang(st.e), lo), [x1, y1] = K.pt(K.ang(st.e), hi); g += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="var(--ink2)" stroke-width=".6" opacity=".55"/>`; });
for (const st of n.stages) { const [r0, r1] = BAND[st.type]; g += `<path d="${K.arc(st.s, st.e, r0, r1)}" fill="${COL[st.type]}"/>`; }
// name the times you woke up
for (const st of n.stages.filter((x, i) => x.type === 'AWAKE' && i > 0 && i < n.stages.length - 1 && x.e - x.s >= 6e4)) { const a = K.ang((st.s + st.e) / 2), [x, y] = K.pt(a, 136), r = Math.sin(a) > 0; }
// stage names along the start edge
for (const [k, name] of [['AWAKE', '清醒'], ['REM', 'REM'], ['LIGHT', '浅睡'], ['DEEP', '深睡']]) { const [r0, r1] = BAND[k]; const a = K.ang(n.bed) - 0.05; const [x, y] = K.pt(a, (r0 + r1) / 2); g += `<text class="cn" x="${x - 4}" y="${y + 4}" text-anchor="end" style="font-size:11px">${name}</text>`; }
// heart rate as a thin ring just outside
g += corona(K, smooth(n.hr, 4), 130, 146, { lo: 46, hi: 72, fill: false, width: 1.1 });
const lo = n.hr.reduce((a, p) => (p.v < a.v ? p : a)); const [lx, ly] = K.pt(K.ang(lo.t), 130 + (lo.v - 46) / 26 * 16);
g += `<circle cx="${lx}" cy="${ly}" r="3" fill="var(--hr)"/>`;
// bed and wake ticks
for (const [t, lab] of [[n.bed, '23:26 入睡'], [n.wake, '06:44 醒来']]) { const a = K.ang(t), [x0, y0] = K.pt(a, 70), [x1, y1] = K.pt(a, 152); g += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="var(--ink)" stroke-width="1"/>`; const [tx, ty] = K.pt(a, 178); g += `<text class="cnb" x="${tx}" y="${ty}" text-anchor="${Math.sin(a) > 0 ? 'start' : 'end'}">${lab}</text>`; }
const deep = n.stages.filter((s) => s.type === 'DEEP').sort((a, b) => (b.e - b.s) - (a.e - a.s))[0];
// centre
g += `<text class="cn" x="${cx}" y="${cy - 30}" text-anchor="middle">睡着</text><text class="big" x="${cx}" y="${cy + 20}" text-anchor="middle" style="font-size:60px">7:03</text><text class="cn" x="${cx}" y="${cy + 40}" text-anchor="middle">睡眠分 ${D.today.sleepScore}</text>`;
document.getElementById('dial').innerHTML = g;
// stage bars against your usual
const st = [['深睡', 'var(--deep)', n.deep, 92], ['浅睡', 'var(--light)', n.light, 236], ['REM', 'var(--rem)', n.rem, 97], ['清醒', 'var(--awake-strong)', n.awake, 22]];
const mx = 260, hm = (m) => `${Math.floor(m / 60)}:${String(Math.round(m % 60)).padStart(2, '0')}`;
let b = `<div class="row"><div><div class="k"><i style="background:var(--hr)"></i>最低心率</div><div class="v">${Math.round(lo.v)}<small>bpm</small></div><div class="n">${D.hm(lo.t)}，深睡里</div></div><div><div class="k"><i style="background:var(--light)"></i>HRV</div><div class="v">56<small>ms</small></div><div class="n">比平时高 6 ms</div></div><div><div class="k"><i style="background:var(--ink)"></i>入睡用了</div><div class="v">14<small>分钟</small></div><div class="n">平时 11 分钟</div></div></div>`;
b += `<h2>每个阶段，和平时比</h2><div class="bars">${st.map(([k, c, m, u]) => `<div class="bar"><span class="k2">${k}</span><span class="tr"><i style="width:${m / mx * 100}%;background:${c}"></i><u style="left:${u / mx * 100}%"></u></span><span class="vv">${hm(m)}<small>平时 ${hm(u)}</small></span></div>`).join('')}</div>`;
// the week as seven small watch faces
b += `<h2>这一周</h2><div id="week" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px"></div>`;
document.getElementById('below').innerHTML = b;
const wk = D.nights.slice(-7);
document.getElementById('week').innerHTML = wk.map((x, i) => {
  const k = makeDial({ cx: 24, cy: 24, mode: 'night' });
  const BB = { AWAKE: [20.5, 23], REM: [17, 20], LIGHT: [13.5, 16.5], DEEP: [8.5, 13] };
  const bands = x.stages.map((st) => `<path d="${k.arc(st.s, st.e, BB[st.type][0], BB[st.type][1])}" fill="${COL[st.type]}"/>`).join('');
  const d = new Date(x.date); d.setDate(d.getDate() - 1);
  const wd = '日一二三四五六'[d.getDay()];
  return `<div style="text-align:center"><svg viewBox="0 0 48 48" width="48" height="48" style="margin:0 auto"><circle cx="24" cy="24" r="23" fill="none" stroke="var(--line)"/>${bands}</svg><div style="font:17px 'Instrument Serif',serif;margin-top:4px">${hm(x.asleep)}</div><div class="n" style="margin:0">${i === 6 ? '昨晚' : '周' + wd}</div></div>`;
}).join('');
document.body.insertAdjacentHTML('beforeend', tabs('睡眠'));
</script></body></html>
