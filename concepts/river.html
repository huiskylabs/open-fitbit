<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>河流</title><link rel="stylesheet" href="base.css">
<style>
:root { --bg: #fbfaf7; --ink: #121212; --ink2: #56544f; --mut: #9b9890; --line: #e6e3dc;
  --deep: #26239a; --light: #5a64ee; --rem: #a8b1ff; --wake: #d7d9ff; --day: #e6dfd2; --str: #0f9f6b; --walk: #8fbf9f; --ball: #8a4dff; }
body { background: var(--bg); color: var(--ink); padding: 54px 16px 110px; }
h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -.5px; }
.lede { margin-top: 2px; font-size: 13px; color: var(--ink2); }
.nums { display: flex; gap: 22px; margin: 14px 0 4px; }
.nums .v { font: 800 44px/1 "Barlow Condensed", sans-serif; }
.nums .v small { font: 700 12px -apple-system, "PingFang SC", sans-serif; margin-left: 2px; color: var(--ink2); }
.nums .k { font-size: 12px; font-weight: 600; color: var(--ink2); }
svg text { font: 600 11px "Barlow Condensed", sans-serif; fill: var(--mut); letter-spacing: .02em; }
.ann { position: absolute; left: 196px; right: 16px; }
.ann .t { font: 700 13px "Barlow Condensed", sans-serif; color: var(--mut); letter-spacing: .04em; }
.ann .h { font-size: 15px; font-weight: 700; line-height: 1.3; }
.ann .h em { font-style: normal; font: 800 20px "Barlow Condensed", sans-serif; }
.ann .d { font-size: 12px; color: var(--ink2); line-height: 1.45; }
.ann .d b { font: 700 15px "Barlow Condensed", sans-serif; color: var(--ink); letter-spacing: .03em; }
.wrap { position: relative; margin-top: 18px; }
.key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--ink2); margin-top: 8px; }
.key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.tabs { background: color-mix(in srgb, var(--bg) 92%, transparent); border-top: 1px solid var(--line); color: var(--mut); }
.tabs span:first-child { color: var(--ink); font-weight: 600; }
</style></head><body>
<h1>今天</h1>
<div class="lede">从昨晚入睡流到现在。河越宽，心跳越快。</div>
<div class="nums"><div><div class="k">恢复分</div><div class="v">78</div></div><div><div class="k">睡眠分</div><div class="v">84</div></div><div><div class="k">步数</div><div class="v">11,240</div></div></div>
<div class="key"><span><i style="background:var(--deep)"></i>深睡</span><span><i style="background:var(--light)"></i>浅睡</span><span><i style="background:var(--rem)"></i>REM</span><span><i style="background:var(--day)"></i>醒着</span><span><i style="background:var(--str)"></i>力量</span><span><i style="background:var(--ball)"></i>篮球</span></div>
<div class="wrap" id="wrap"><svg id="river" width="361"></svg></div>
<nav class="tabs"><span><b></b>今天</span><span><b></b>睡眠</span><span><b></b>运动</span><span><b></b>力量</span><span><b></b>心率</span></nav>
<script type="module">
import * as D from './data.js';
const n = D.last, start = n.bed - 20 * 60e3, end = D.NOW, cx = 104;
// time runs down; quiet hours are squeezed, sleep and workouts get room
const rate = (t) => (t < n.wake ? 64 : D.events.some((e) => t >= e.s - 10 * 60e3 && t < e.e + 10 * 60e3) ? 110 : 18) / 60; // px per minute
const ys = []; let acc = 0; for (let t = start; t <= end; t += 60e3) { ys.push(acc); acc += rate(t); }
const y = (t) => ys[Math.max(0, Math.min(ys.length - 1, Math.round((t - start) / 60e3)))] + 10;
const H = acc + 30;
const hr = [...n.hr, ...D.dayHr];
const hrAt = (t) => { const i = Math.round((t - hr[0].t) / 60e3); return hr[Math.max(0, Math.min(hr.length - 1, i))]?.v ?? 60; };
const half = (v) => 7 + Math.max(0, v - 46) * 0.3;
const C = { DEEP: 'var(--deep)', LIGHT: 'var(--light)', REM: 'var(--rem)', AWAKE: 'var(--wake)' };
const EC = { strength: 'var(--str)', walk: 'var(--walk)', ball: 'var(--ball)' };
const colorAt = (t) => { if (t < n.bed) return 'var(--day)'; if (t < n.wake) return C[n.stages.find((s) => t >= s.s && t < s.e)?.type || 'LIGHT']; const e = D.events.find((e) => t >= e.s && t < e.e); return e ? EC[e.kind] : 'var(--day)'; };
let g = '';
// hour ticks on the left
for (let t = Math.ceil(start / 36e5) * 36e5; t <= end; t += 36e5) { const h = new Date(t).getHours(); g += `<line x1="26" x2="${cx - 60}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="0" y="${y(t) + 4}">${String(h).padStart(2, '0')}:00</text>`; }
// the river: smoothed width, colored by what you were doing
const step = 60e3; let prev = null;
const sm = (t) => { let s = 0, w = 0; for (let j = -9; j <= 9; j++) { const k = Math.exp(-(j * j) / 30); s += hrAt(t + j * 60e3) * k; w += k; } return s / w; };
for (let t = start; t < end; t += step) {
  const w = half(sm(t)), y0 = y(t), y1 = y(t + step);
  g += `<rect x="${cx - w}" y="${y0}" width="${2 * w}" height="${Math.max(.6, y1 - y0 + .4)}" fill="${colorAt(t)}"/>`;
}
g += `<line x1="${cx}" x2="${cx}" y1="${y(end)}" y2="${y(end) + 14}" stroke="var(--ink)" stroke-width="2"/><circle cx="${cx}" cy="${y(end) + 16}" r="4" fill="var(--ink)"/>`;
// notes on the right, pushed down so they never overlap
const notes = [
  [n.bed, '23:26', '入睡', '用了 14 分钟睡着'],
  [n.stages.find((s) => s.type === 'DEEP').s, '23:54', '深睡 <em>1:18</em>', '都在前半夜，最低心率 <b>50</b> bpm'],
  [n.stages.filter((s) => s.type === 'REM').at(-1).s, '05:31', '最长的一段梦', 'REM 一共 <b>1:56</b>，比平时多 19 分钟'],
  [n.wake, '06:44', '醒来', '睡了 <b>7:03</b>，比 8 小时少 57 分钟'],
  [D.events[0].s, '07:11–08:03', '力量 <em>52</em> 分钟', '卧推 <b>8/8/8/6</b> · 70 kg<br>引体向上 <b>11/11/10/9</b> 次，+1'],
  [D.events[1].s, '12:34', '散步 <em>32</em> 分钟', '3,410 步'],
  [D.events[2].s, '19:05–20:21', '篮球 <em>76</em> 分钟', '最高 <b>163</b> bpm · 中高强度 <b>58</b> 分钟'],
  [end, '21:30', '现在', '心率回到 <b>71</b> bpm'],
];
const wrap = document.getElementById('wrap'), svg = document.getElementById('river');
const els = notes.map(([, tt, h, d]) => { const el = document.createElement('div'); el.className = 'ann'; el.innerHTML = `<div class="t">${tt}</div><div class="h">${h}</div><div class="d">${d}</div>`; wrap.appendChild(el); return el; });
let floor = 0;
notes.forEach(([t], i) => {
  const yy = Math.max(y(t) - 8, floor); els[i].style.top = yy + 'px'; floor = yy + els[i].offsetHeight + 14;
  const w = half(sm(t));
  g += `<polyline points="${cx + w + 3},${y(t)} ${168},${y(t)} ${186},${yy + 9}" fill="none" stroke="var(--mut)" stroke-width=".8"/>`;
});
svg.setAttribute('height', Math.max(H, floor)); svg.innerHTML = g;
</script></body></html>
