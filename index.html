<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="我的健康">
  <meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0b" media="(prefers-color-scheme: dark)">
  <meta name="referrer" content="no-referrer">
  <title>我的健康</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1><span id="title">今天</span><span id="plabel"></span></h1>
      <div class="top-actions">
        <button id="sync" class="icon-btn" aria-label="刷新"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button id="open-settings" class="icon-btn" aria-label="设置"><svg viewBox="0 0 24 24"><path d="M10.3,4.3 L10.5,1.6 L13.5,1.6 L13.7,4.3 L16.2,5.3 L18.3,3.6 L20.4,5.7 L18.7,7.8 L19.7,10.3 L22.4,10.5 L22.4,13.5 L19.7,13.7 L18.7,16.2 L20.4,18.3 L18.3,20.4 L16.2,18.7 L13.7,19.7 L13.5,22.4 L10.5,22.4 L10.3,19.7 L7.8,18.7 L5.7,20.4 L3.6,18.3 L5.3,16.2 L4.3,13.7 L1.6,13.5 L1.6,10.5 L4.3,10.3 L5.3,7.8 L3.6,5.7 L5.7,3.6 L7.8,5.3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
      </div>
    </div>
    <div id="period" class="period" hidden>
      <div class="seg" role="tablist" aria-label="时间范围">
        <button data-range="d" role="tab">日</button><button data-range="w" role="tab">周</button><button data-range="m" role="tab">月</button><button data-range="q" role="tab">3个月</button>
      </div>
      <div class="pnav">
        <button data-nav="1" aria-label="更早"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button data-nav="-1" aria-label="更近"><svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view" aria-live="polite"></main>
  <div id="tip" class="tip" hidden></div>
  <nav class="tabs" role="tablist">
    <button data-tab="today" role="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>今天</button>
    <button data-tab="sleep" role="tab"><svg viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>睡眠</button>
    <button data-tab="workouts" role="tab"><svg viewBox="0 0 24 24"><path d="M13 2.5 5 13.5h6l-1 8 8-11h-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>运动</button>
    <button data-tab="heart" role="tab"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>心率</button>
  </nav>
  <script type="module" src="app.js"></script>
</body>
</html>
